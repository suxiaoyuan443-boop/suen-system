name: Build cult image materials 20261001
on:
  push:
    paths:
      - '.github/workflows/temp-cult-images-20261001.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl poppler-utils python3-pil
      - name: Download and prepare sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack raw
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/42/Seti_before_Amun.jpg' -o raw/egypt_seti_amun.jpg
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/a/a4/Seti_I_Temple_Reliefs_at_Abydos_%28II%29.jpg' -o raw/egypt_seti_relief2.jpg
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/6/62/Bathing_the_Divine.jpg' -o raw/hindu_bathing.jpg
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/8/83/Shiva_Lingam_at_Sri_Punyalingeswara_Swamy_Kshetram%2C_Choutuppal%2C_Telangana.png' -o raw/hindu_decorated.png
          curl -fL --retry 3 'https://upload.wikimedia.org/wikipedia/commons/5/5f/Lord_Shiva_devotees_offering_milk%2C_flowers%2C_fruits_and_bel_leaves_on_a_Shivaling_for_seeking_divine_blessings%2C_in_a_city_temple_at_the_celebration_of_Maha_Shivaratri%2C_in_New_Delhi_on_February_23%2C_2009.jpg' -o raw/hindu_offering.jpg
          curl -fL --retry 3 'https://cdli.earth/dl/photo/P394438.jpg' -o raw/mesopotamia_mis_pi.jpg
          curl -fL --retry 3 'https://resources.metmuseum.org/resources/metpublications/pdf/Ancient_Near_Eastern_Art_The_Metropolitan_Museum_of_Art_Bulletin_v_41_no_4_Spring_1984.pdf' -o raw/met_ane_bulletin.pdf

          cp raw/egypt_seti_amun.jpg pack/02_古埃及_塞提一世在阿蒙前举行仪式.jpg
          cp raw/egypt_seti_relief2.jpg pack/03_古埃及_阿拜多斯祭祀浮雕.jpg
          cp raw/mesopotamia_mis_pi.jpg pack/04_美索不达米亚_洗口仪式泥板.jpg
          cp raw/hindu_decorated.png pack/06_印度教_装饰后的湿婆林伽.png
          cp raw/hindu_bathing.jpg pack/07_印度教_神像沐浴实拍.jpg
          cp raw/hindu_offering.jpg pack/08_印度教_牛奶鲜花供奉实拍.jpg

          FOUND=''
          PAGES=$(pdfinfo raw/met_ane_bulletin.pdf | awk '/Pages:/ {print $2}')
          for i in $(seq 1 "$PAGES"); do
            pdftotext -f "$i" -l "$i" -layout raw/met_ane_bulletin.pdf - 2>/dev/null > /tmp/page.txt || true
            if grep -qiE 'CARE AND FEEDING OF THE GODS|feed.*clothe.*wash|feeding of the gods' /tmp/page.txt; then
              echo "Found target on PDF page $i"
              FOUND="$i"
              cp /tmp/page.txt pack/05_美索不达米亚_神像日常照料_页文字.txt
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "Target text not found" >&2
            exit 1
          fi
          pdftoppm -f "$FOUND" -singlefile -png -r 180 raw/met_ane_bulletin.pdf pack/05_美索不达米亚_神像日常照料_学术原页
          printf '%s\n' "$FOUND" > pack/05_页码.txt

          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path

          # Make source-only composites; no synthetic imagery, no red boxes.
          imgs=[
              Image.open('raw/egypt_seti_amun.jpg').convert('RGB'),
              Image.open('raw/mesopotamia_mis_pi.jpg').convert('RGB'),
              Image.open('raw/hindu_bathing.jpg').convert('RGB'),
          ]
          W,H=1440,810
          panels=[]
          for im in imgs:
              # center crop to 1:1-ish panel
              target_w=W//3
              ratio=target_w/H
              w,h=im.size
              if w/h > ratio:
                  nw=int(h*ratio); x=(w-nw)//2; crop=im.crop((x,0,x+nw,h))
              else:
                  nh=int(w/ratio); y=(h-nh)//2; crop=im.crop((0,y,w,y+nh))
              panels.append(crop.resize((target_w,H),Image.Resampling.LANCZOS))
          canvas=Image.new('RGB',(W,H),'white')
          for i,p in enumerate(panels):
              canvas.paste(p,(i*(W//3),0))
          canvas.save('pack/01_开头_三传统真实资料拼图.jpg',quality=94)
          canvas.save('pack/09_结尾_三传统真实资料拼图.jpg',quality=94)

          # Make mobile crop from Met page, preserving publication text/image.
          p=Path('pack/05_美索不达米亚_神像日常照料_学术原页.png')
          im=Image.open(p).convert('RGB')
          w,h=im.size
          # keep central page with margins trimmed
          crop=im.crop((int(w*.05),int(h*.05),int(w*.95),int(h*.95)))
          crop.save('pack/05_美索不达米亚_神像日常照料_学术原页.png')

          for p in Path('pack').glob('*'):
              if p.suffix.lower() in ['.jpg','.jpeg','.png']:
                  with Image.open(p) as im:
                      im.verify()
                  print(p.name, p.stat().st_size)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cult-image-materials-20261001
          path: pack/
          retention-days: 3
