name: Build Hiddenli Cult Image 2026-10-01
on:
  push:
    paths:
      - '.github/workflows/temp-hiddenli-cult-image-20261001.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil python3-requests
      - name: Fetch and prepare verified images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out raw
          python3 - <<'PY'
          import requests, os, urllib.parse
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 Suen research build'})
          def get(url,path):
              try:
                  r=S.get(url,timeout=90)
                  r.raise_for_status()
              except requests.exceptions.SSLError:
                  r=S.get(url,timeout=90,verify=False)
                  r.raise_for_status()
              open(path,'wb').write(r.content)
              print(path, r.status_code, r.headers.get('content-type'), len(r.content))
          get('https://ashtalakshmitemple.co.in/uploads/blog/posts/bpgal848842892_648594388.jpg','raw/hindu_bath.jpg')
          get('https://ashtalakshmitemple.co.in/uploads/blog/posts/bpgal848842892_1330476506.jpg','raw/hindu_dressed.jpg')
          get('https://media.britishmuseum.org/media/Repository/Documents/2014_10/1_6/1bcbbb4a_c6a9_416f_a9a0_a3b7006d470d/mid_00032607_001.jpg','raw/sungod.jpg')
          get('https://isac-assets.s3.amazonaws.com/isac-publications/ois8.pdf','raw/ois8.pdf')
          get('https://krkswami.com/sites/default/files/2025-11/vaishnava_tantra_as_outlined_in_the_bhagavata.pdf','raw/vaishnava.pdf')
          api='https://commons.wikimedia.org/w/api.php'
          def commons(title,path):
              q=S.get(api,params={'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':'File:'+title},timeout=60)
              q.raise_for_status()
              page=next(iter(q.json()['query']['pages'].values()))
              get(page['imageinfo'][0]['url'],path)
          commons('Painted Relief of Seti I offering a tray of food ... (36711531995).jpg','raw/egypt_food.jpg')
          commons('AbydosSetiChapelRelief145.jpg','raw/egypt_censing.jpg')
          PY

          # identify page in OIS8 containing the mīs pî sensory line
          pages=$(pdfinfo raw/ois8.pdf | awk '/^Pages:/ {print $2}')
          found=""
          for p in $(seq 1 "$pages"); do
            pdftotext -f "$p" -l "$p" -layout raw/ois8.pdf - 2>/dev/null | grep -qi "cannot smell incense" && { found="$p"; break; }
          done
          test -n "$found"
          echo "OIS8 target page=$found"
          pdftoppm -f "$found" -l "$found" -r 180 -png -singlefile raw/ois8.pdf raw/meso_quote >/dev/null 2>&1
          pdftoppm -f 3 -l 3 -r 180 -png -singlefile raw/vaishnava.pdf raw/vaishnava_180 >/dev/null 2>&1
          pdftoppm -f 4 -l 4 -r 180 -png -singlefile raw/vaishnava.pdf raw/vaishnava_181 >/dev/null 2>&1

          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import os, pathlib

          def save_scaled(src,dst,maxw=1600):
              im=Image.open(src).convert('RGB')
              if im.width>maxw:
                  h=round(im.height*maxw/im.width)
                  im=im.resize((maxw,h),Image.LANCZOS)
              im.save(dst,quality=93)

          save_scaled('raw/hindu_bath.jpg','out/01_印度教神像沐浴_真实寺庙照片.jpg')
          save_scaled('raw/egypt_censing.jpg','out/02_古埃及_塞提一世在神龛前焚香_阿拜多斯.jpg')
          save_scaled('raw/egypt_food.jpg','out/03_古埃及_塞提一世献食_阿拜多斯.jpg')
          save_scaled('raw/sungod.jpg','out/05_美索不达米亚_沙玛什太阳神石板.jpg')
          save_scaled('raw/hindu_dressed.jpg','out/07_印度教_沐浴后着装装饰_真实寺庙照片.jpg')

          # Mesopotamian scholarly page crop: keep central body text; no colored box
          im=Image.open('raw/meso_quote.png').convert('RGB')
          w,h=im.size
          # produce full verified page and a readable central crop
          save_scaled('raw/meso_quote.png','out/04_美索不达米亚_mis_pi_学术原页.jpg')
          crop=im.crop((int(w*.06),int(h*.18),int(w*.95),int(h*.83)))
          crop.save('out/04b_美索不达米亚_mis_pi_关键段落裁切.jpg',quality=94)

          # Vaishnava scholarly page 180: right column has image-presence + prana-pratistha
          im=Image.open('raw/vaishnava_180.png').convert('RGB'); w,h=im.size
          crop=im.crop((int(w*.49),int(h*.26),int(w*.96),int(h*.93)))
          crop.save('out/06_毗湿奴派_图像临在与生命安立_学术原页裁切.jpg',quality=94)

          # page 181: top right has bathing/decoration passage
          im=Image.open('raw/vaishnava_181.png').convert('RGB'); w,h=im.size
          crop=im.crop((int(w*.50),int(h*.06),int(w*.96),int(h*.52)))
          crop.save('out/06b_毗湿奴派_沐浴与装饰_学术原页裁切.jpg',quality=94)

          # comparison collage from three real visuals
          ims=[]
          for p in ['out/03_古埃及_塞提一世献食_阿拜多斯.jpg','out/05_美索不达米亚_沙玛什太阳神石板.jpg','out/01_印度教神像沐浴_真实寺庙照片.jpg']:
              x=Image.open(p).convert('RGB')
              x=ImageOps.fit(x,(720,720),method=Image.LANCZOS)
              ims.append(x)
          canvas=Image.new('RGB',(2160,720),'white')
          for i,x in enumerate(ims): canvas.paste(x,(720*i,0))
          canvas.save('out/08_三传统真实图像对照.jpg',quality=93)

          for p in sorted(pathlib.Path('out').glob('*.jpg')):
              with Image.open(p) as x:
                  x.verify()
              assert p.stat().st_size>10000, p
              print(p.name,p.stat().st_size)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hiddenli-cult-image-20261001-assets
          path: out/
          retention-days: 3
