name: Temp build deity care visuals
on:
  push:
    paths:
      - '.github/workflows/temp-deity-care-20261001.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil
      - name: Fetch and prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack raw meso
          python3 - <<'PY'
          import requests, urllib.parse, pathlib
          files = {
            "egypt_reveal.jpg":"Sethos2-Disrobing-Amen-Re.jpg",
            "egypt_food.jpg":"Painted Relief of Seti I offering a tray of food ... (36711531995).jpg",
            "hindu_bath.jpg":"Bathing the Divine.jpg",
            "hindu_food.jpg":"ANNAKUT FESTIVAL 07.jpg",
            "hindu_murti.jpg":"Krishna10.JPG",
          }
          S=requests.Session()
          S.headers["User-Agent"]="SuenResearch/1.0"
          for out, fn in files.items():
              api="https://commons.wikimedia.org/w/api.php"
              params={"action":"query","format":"json","prop":"imageinfo","iiprop":"url","titles":"File:"+fn}
              j=S.get(api,params=params,timeout=60).json()
              page=next(iter(j["query"]["pages"].values()))
              url=page["imageinfo"][0]["url"]
              b=S.get(url,timeout=120).content
              pathlib.Path("raw/"+out).write_bytes(b)
              print(out, len(b), url)
          pdf=S.get("https://isac.uchicago.edu/sites/default/files/uploads/shared/docs/ancient_mesopotamia.pdf",timeout=180).content
          pathlib.Path("raw/ancient_mesopotamia.pdf").write_bytes(pdf)
          print("meso pdf",len(pdf))
          PY
          pages=$(pdfinfo raw/ancient_mesopotamia.pdf | awk '/^Pages:/ {print $2}')
          p1=''; p2=''
          for p in $(seq 1 "$pages"); do
            pdftotext -f "$p" -l "$p" -layout raw/ancient_mesopotamia.pdf meso/p.txt
            if [ -z "$p1" ] && grep -qi 'receptacle of the divine presence' meso/p.txt; then p1="$p"; fi
            if [ -z "$p2" ] && grep -qi 'served two meals per day' meso/p.txt; then p2="$p"; fi
            if [ -n "$p1" ] && [ -n "$p2" ]; then break; fi
          done
          echo "presence_page=$p1 meals_page=$p2"
          test -n "$p1"; test -n "$p2"
          pdftoppm -f "$p1" -l "$p1" -jpeg -r 180 -singlefile raw/ancient_mesopotamia.pdf meso/presence
          pdftoppm -f "$p2" -l "$p2" -jpeg -r 180 -singlefile raw/ancient_mesopotamia.pdf meso/meals
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          # normalize Wikimedia images for mobile
          for src in ["egypt_reveal.jpg","egypt_food.jpg","hindu_bath.jpg","hindu_food.jpg","hindu_murti.jpg"]:
              im=Image.open("raw/"+src).convert("RGB")
              im.thumbnail((1600,1600))
              im.save("pack/"+src,quality=91,optimize=True)
          # crop the relevant central text bands from scholarly pages; preserve enough context and page heading
          for src,out,top,bottom in [
              ("meso/presence.jpg","meso_presence.jpg",0.26,0.75),
              ("meso/meals.jpg","meso_meals.jpg",0.18,0.82),
          ]:
              im=Image.open(src).convert("RGB")
              w,h=im.size
              cr=im.crop((int(w*0.05),int(h*top),int(w*0.95),int(h*bottom)))
              cr.save("pack/"+out,quality=92,optimize=True)
          # opening / closing collage made only from verified real images
          ims=[Image.open("pack/egypt_food.jpg").convert("RGB"), Image.open("pack/hindu_bath.jpg").convert("RGB"), Image.open("pack/hindu_murti.jpg").convert("RGB")]
          cells=[]
          for im in ims:
              im=ImageOps.fit(im,(700,700),method=Image.Resampling.LANCZOS)
              cells.append(im)
          canvas=Image.new("RGB",(2100,700),"white")
          for i,im in enumerate(cells): canvas.paste(im,(700*i,0))
          canvas.save("pack/cross_tradition_collage.jpg",quality=91,optimize=True)
          for p in Path("pack").glob("*.jpg"):
              with Image.open(p) as im: im.verify()
              print(p.name,p.stat().st_size)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deity-care-visuals-20261001
          path: pack/
          retention-days: 3
