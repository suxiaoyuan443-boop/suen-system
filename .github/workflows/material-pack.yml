name: Build historical material pack

on:
  push:
    paths:
      - '.github/workflows/material-pack.yml'
      - '.github/material-pack-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil curl tesseract-ocr

      - name: Download and build editing-ready images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack work

          # 01 + 03｜Heptameron 1565 historical diagram
          curl -fL --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Heptameron_magic_circle_1565.jpg' -o work/heptameron.jpg
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('work/heptameron.jpg').convert('RGB')
          im.save('pack/01_赫普塔梅隆_圆图全图.jpg', quality=95)
          w,h=im.size
          im.crop((0,0,w,int(h*.46))).resize((1600,1000)).save('pack/03_赫普塔梅隆_圆图细节.png')
          PY

          # 02｜Robert Turner 1655 historical scan.
          # Internet Archive djvu object numbers map directly to PDF page numbers in this section.
          # Prior logs proved object 112 == PDF p.112; IA OCR candidate object 100 is the Heptameron intro.
          curl -fL --retry 3 'https://archive.org/download/b20458563/b20458563.pdf' -o work/heptameron1655.pdf
          HEP_PAGE=100
          pdftoppm -f "$HEP_PAGE" -singlefile -png -r 280 work/heptameron1655.pdf work/heptext >/dev/null 2>&1
          tesseract work/heptext.png work/hepcheck -l eng >/dev/null 2>&1 || true
          HEP_TXT=$(cat work/hepcheck.txt 2>/dev/null || true)
          echo '--- Heptameron page check ---'
          printf '%s\n' "$HEP_TXT" | head -120
          if ! printf '%s' "$HEP_TXT" | grep -Eqi 'magical elements'; then
            echo 'Heptameron PDF p.100 missing Magical Elements heading/context' >&2
            exit 20
          fi
          if ! printf '%s' "$HEP_TXT" | grep -Eqi 'greate(st|ft).{0,60}power.{0,160}circl|fortre.{0,220}(evil|evill).{0,90}(spirit|fpirit)|defen[cs]e.{0,160}(spirit|fpirit)'; then
            echo 'Heptameron PDF p.100 missing protection-language content' >&2
            exit 21
          fi
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('work/heptext.png').convert('RGB'); w,h=im.size
          im.crop((int(w*.045),int(h*.035),int(w*.955),int(h*.965))).save('pack/02_赫普塔梅隆_保护作用原页.png')
          PY

          # 04-05｜Key of Solomon, George Redway 1889 historical scan
          if ! curl -fL --retry 2 'https://archive.org/download/b24884431/b24884431.pdf' -o work/key.pdf; then
            curl -fL --retry 2 'https://upload.wikimedia.org/wikipedia/commons/0/0f/The_Key_of_Solomon_the_king_%28Clavicula_Salomonis%29_%28IA_b24884431%29.pdf' -o work/key.pdf
          fi
          KEY_PAGE=''
          PAGES=$(pdfinfo work/key.pdf | awk '/^Pages:/ {print $2}')
          for i in $(seq 1 "$PAGES"); do
            txt=$(pdftotext -f "$i" -l "$i" -layout work/key.pdf - 2>/dev/null || true)
            if printf '%s' "$txt" | grep -Eqi 'nine feet|nine foot|9 feet|entrance.*north|north.*entrance'; then KEY_PAGE="$i"; break; fi
          done
          if [ -z "$KEY_PAGE" ]; then echo 'Could not locate Key of Solomon target page' >&2; exit 22; fi
          echo "Key of Solomon PDF page: $KEY_PAGE"
          pdftoppm -f "$KEY_PAGE" -singlefile -png -r 230 work/key.pdf work/key1 >/dev/null 2>&1
          NEXT=$((KEY_PAGE+1))
          pdftoppm -f "$NEXT" -singlefile -png -r 230 work/key.pdf work/key2 >/dev/null 2>&1
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('work/key1.png').convert('RGB'); w,h=a.size
          a.crop((int(w*.09),int(h*.08),int(w*.91),int(h*.94))).save('pack/04_所罗门之钥_九英尺绳_四方向_北面入口.png')
          b=Image.open('work/key2.png').convert('RGB'); w,h=b.size
          b.crop((int(w*.09),int(h*.05),int(w*.91),int(h*.90))).save('pack/05_所罗门之钥_进入_香炉_重新进入_合上入口.png')
          PY

          # 06 + 08｜Goetia circle and triangle; 08 is a physical duplicate for the final timeline
          curl -fL --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Circle%20and%20Triagle%20of%20Solomon%20-%20Sloane%203648.png' -o work/goetia.png
          cp work/goetia.png 'pack/06_歌提亚_圆与三角.png'
          cp work/goetia.png 'pack/08_歌提亚_圆与三角_结尾.png'

          # 07｜Chicago Assyrian Dictionary Z, zisurru headword on printed p.137
          curl -fL --retry 3 'https://isac-assets.s3.amazonaws.com/isac-publications/cad_z.pdf' -o work/cad_z.pdf
          CAD_PAGE=153
          CAD_TEXT=$(pdftotext -f "$CAD_PAGE" -l "$CAD_PAGE" -layout work/cad_z.pdf - 2>/dev/null || true)
          echo '--- CAD page check ---'
          printf '%s\n' "$CAD_TEXT" | grep -Ei -A16 -B6 'zisurr' | head -100 || true
          if ! printf '%s' "$CAD_TEXT" | grep -Eqi 'zisurr'; then echo 'CAD target page missing zisurru' >&2; exit 23; fi
          if ! printf '%s' "$CAD_TEXT" | grep -Eqi 'magic circle.*flour|circle drawn with flour'; then echo 'CAD target page missing flour-circle definition' >&2; exit 24; fi
          if ! printf '%s' "$CAD_TEXT" | grep -Eqi 'bull|censer|torch'; then echo 'CAD target page missing bull example' >&2; exit 25; fi
          pdftoppm -f "$CAD_PAGE" -singlefile -png -r 280 work/cad_z.pdf work/cad >/dev/null 2>&1
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('work/cad.png').convert('RGB'); w,h=im.size
          im.crop((int(w*.04),int(h*.03),int(w*.96),int(h*.97))).save('pack/07_芝加哥亚述语词典_齐苏鲁_公牛例句.png')
          PY

          cat > pack/剪辑顺序.txt <<'EOF'
          《隐理｜为什么很多仪式开始前要先画一个圈？》
          建议成片时长：约3分钟

          01｜00:00–00:18｜赫普塔梅隆圆图全图
          口播：很多古代魔法书在正式召唤以前，会先在地上画圈。有的还会留一个入口，等人进去以后再合上；有的会在圈外另外画一个位置，留给召来的灵。这个步骤到底有什么用，原文写得比现在很多解释具体得多。
          画面：先全图，缓慢推近。画面加中文标题“为什么仪式开始前要先画圈？”

          02｜00:18–00:43｜赫普塔梅隆保护作用原页
          口播：《赫普塔梅隆》在讲怎么画圈以前，先解释了它的作用：这些圈像防御工事，让正在操作的人免受恶灵伤害。后面写到灵出现时会制造恐怖景象，试图把其他参加者吓出圈。
          画面：展示1655年真实扫描页，放大写到圆的保护作用的段落；只加中文框注，原文保持可见。

          03｜00:43–01:00｜赫普塔梅隆圆图细节
          口播：接着才是怎么制作。召什么、朝哪个方向、在哪个季节、哪一天、哪个小时，都会影响这个圈；里面写的名字也跟这些条件有关。
          画面：展示圆图局部，依次放大外围文字与方向位置；中文小字标“日期／小时／方向／名字”。

          04｜01:00–01:22｜所罗门之钥九英尺绳、四方向、北面入口
          口播：十六世纪的一份《所罗门之钥》手稿写得更细。先确定中心，用九英尺长的绳子测量，再标出东、西、南、北，画到北面时特意留出一个入口。
          画面：采用1889年印本真实扫描作为可视证据；依次框出“九英尺”“东、西、南、北”“北面入口”对应段落。画面版次与口播所依据的早期手稿证据分开处理。

          05｜01:22–01:50｜所罗门之钥进入、香炉、重新进入、合上入口
          口播：参加仪式的人从这里进去，各自站到规定的位置。主持者中途出去处理香炉，回来以后，再把刚才留下的入口合上。
          画面：先接04下半部的进入与香炉段落，再切05，重点框出“合上开口”对应句。

          06｜01:50–02:12｜歌提亚圆与三角
          口播：《歌提亚》又多画了一个三角。操作者待在圆里，被召来的灵则被要求到圆外的三角中出现。地上两个图形，直接给双方安排了各自的位置。
          画面：先看全图，再分别放大圆与三角；中文箭头仅标“操作者”“被召对象出现的位置”。

          07｜02:12–02:43｜芝加哥亚述语词典齐苏鲁词条与公牛例句
          口播：美索不达米亚还有另一种做法。阿卡德语里有一个叫“齐苏鲁”的词，《芝加哥亚述语词典》解释为用面粉画出的魔法圈。其中一条仪式指令要求先用香炉和火把净化一头公牛，再用这种面粉圈把公牛围起来。
          画面：先框词条标题和“用面粉画出的魔法圈”定义，再下移框出公牛例句；中文框注“面粉圈”“公牛”。

          08｜02:43–03:00｜歌提亚圆与三角结尾独立文件
          口播：所以下次在古代仪式里看到一个圈，先找三个信息：谁待在里面，谁留在外面，还有没有另外指定的位置。把这几个动作看清楚，这个圈在当时具体用来做什么，也就清楚了。
          画面：使用08独立文件，重新从全图缓慢推近；最后停在圆与三角同时可见的位置。
          EOF

          cat > pack/资料来源.txt <<'EOF'
          01｜《赫普塔梅隆》1565年版魔法圆图。来源：Wikimedia Commons，公版。
          02｜《赫普塔梅隆》保护作用原页。Robert Turner 英译，1655年伦敦印本真实扫描；来源：Wellcome Library / Internet Archive b20458563，公版。页面通过 Internet Archive 页级OCR顺序与实际扫描页双重核验。
          03｜《赫普塔梅隆》圆图细节。来源同01，为按最终时间轴重新裁切的独立文件。
          04-05｜《所罗门之钥》S. L. MacGregor Mathers 编译本，George Redway 1889年印本真实扫描；来源：Internet Archive b24884431。这里作为九英尺绳、四方向、北面入口、进入、香炉与合上入口的可视文本证据。口播提到的早期手稿证据与1889年画面版次分开记录，画面不冒充 Sloane 3847 原页。
          06、08｜《歌提亚》所罗门圆与三角图。Wikimedia Commons 文件说明对应英国图书馆 Sloane 3648 图像，由 Joseph H. Peterson 版本转载；公版。08 是按最终剪辑顺序实际复制的独立文件。
          07｜《芝加哥亚述语词典》Z卷，zisurrû词条，印刷页137。来源：芝加哥大学 ISAC 官方PDF。该页同时含“用面粉画出的魔法圈”的定义，以及香炉、火把、公牛的仪式例句。
          EOF

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          required=[
            '01_赫普塔梅隆_圆图全图.jpg',
            '02_赫普塔梅隆_保护作用原页.png',
            '03_赫普塔梅隆_圆图细节.png',
            '04_所罗门之钥_九英尺绳_四方向_北面入口.png',
            '05_所罗门之钥_进入_香炉_重新进入_合上入口.png',
            '06_歌提亚_圆与三角.png',
            '07_芝加哥亚述语词典_齐苏鲁_公牛例句.png',
            '08_歌提亚_圆与三角_结尾.png',
          ]
          for name in required:
              p=Path('pack')/name
              if not p.exists() or p.stat().st_size < 5000:
                  raise SystemExit(f'MISSING/TOO SMALL: {name}')
              with Image.open(p) as im:
                  im.verify()
              print(name,p.stat().st_size,'OK')
          for name in ['剪辑顺序.txt','资料来源.txt']:
              p=Path('pack')/name
              if not p.exists() or p.stat().st_size < 200:
                  raise SystemExit(f'MISSING TEXT FILE: {name}')
          print('ALL 8 TIMELINE IMAGES + 2 TEXT FILES PASSED')
          PY

      - name: Upload finished pack
        uses: actions/upload-artifact@v4
        with:
          name: 隐理_为什么仪式开始前要先画圈_最终交付包
          path: pack/
          retention-days: 7
          if-no-files-found: error
