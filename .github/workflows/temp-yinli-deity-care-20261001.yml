name: Build Yinli deity care HTML 2026-10-01
on:
  push:
    paths:
      - '.github/workflows/temp-yinli-deity-care-20261001.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pillow requests pymupdf beautifulsoup4
      - name: Build HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work
          cat > work/build.py <<'PY'
          import base64, io, os, textwrap, html
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import fitz

          OUT=Path("out")
          WORK=Path("work")
          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0 (compatible; SuenResearch/1.0)"})

          def get(urls, name, minbytes=5000):
              if isinstance(urls,str): urls=[urls]
              last=None
              for u in urls:
                  try:
                      r=S.get(u,timeout=45)
                      if r.status_code==200 and len(r.content)>=minbytes:
                          p=WORK/name
                          p.write_bytes(r.content)
                          print("downloaded",name,u,len(r.content),r.headers.get("content-type"))
                          return p,u
                      last=(u,r.status_code,len(r.content))
                  except Exception as e:
                      last=(u,repr(e))
              raise RuntimeError(f"download failed {name}: {last}")

          def normalize(src, dst, maxw=1800):
              im=Image.open(src).convert("RGB")
              if im.width>maxw:
                  h=round(im.height*maxw/im.width)
                  im=im.resize((maxw,h),Image.Resampling.LANCZOS)
              im.save(dst,quality=93,optimize=True)
              return dst

          met_sakhmet,_=get("https://collectionapi.metmuseum.org/api/collection/v1/iiif/544486/1178731/main-image","sakhmet.jpg",15000)
          bm_mispi,_=get("https://media.britishmuseum.org/media/Repository/Documents/2014_9/29_16/60210e67_fd49_42b9_ae24_a3b501146988/mid_00146071_001.jpg","mispi.jpg",10000)
          ucl_anoint,_=get([
              "https://www.ucl.ac.uk/museums-static/digitalegypt/thebes/archive/uc13043.gif",
              "https://www.ucl.ac.uk/museums-static/digitalegypt/thebes/archive/uc13043small.gif"
          ],"ucl_anoint.gif",2000)
          hindu_murti,_=get([
              "https://pluralism.org/sites/g/files/omnuum10836/files/pluralism/files/murti_the_image_of_god.jpg",
              "https://pluralism.org/sites/g/files/omnuum10836/files/styles/hwp_1_1__360x360_scale/public/pluralism/files/murti_the_image_of_god.jpg?itok=mjGvODpw"
          ],"murti.jpg",5000)
          hindu_lamp,_=get([
              "https://pluralism.org/sites/g/files/omnuum10836/files/pluralism/files/lamp_offerings_copy.jpg",
              "https://pluralism.org/sites/g/files/omnuum10836/files/styles/hwp_1_1__360x360_scale/public/pluralism/files/lamp_offerings_copy.jpg?itok=XFiDNhje"
          ],"lamp.jpg",5000)
          meso_pdf,_=get("https://isac.uchicago.edu/sites/default/files/uploads/shared/docs/ancient_mesopotamia.pdf","ancient_mesopotamia.pdf",100000)

          # Find and render the ISAC page discussing cult images, consecration, and daily care.
          doc=fitz.open(meso_pdf)
          target=None
          for i,p in enumerate(doc):
              t=p.get_text("text").lower()
              if "receptacle of the divine presence" in t and "washing of the mouth" in t:
                  target=i
                  break
          if target is None:
              for i,p in enumerate(doc):
                  t=p.get_text("text").lower()
                  if "feeding, clothing, and washing" in t or ("cult statue" in t and "divine presence" in t):
                      target=i
                      break
          if target is None:
              raise RuntimeError("Could not locate ISAC cult-image page")
          page=doc[target]
          pix=page.get_pixmap(matrix=fitz.Matrix(2.0,2.0), alpha=False)
          meso_page=WORK/"meso_page.png"
          pix.save(meso_page)
          print("ISAC target page",target+1)

          # Create readable crop around the key paragraph if text blocks allow.
          blocks=page.get_text("blocks")
          hits=[]
          for b in blocks:
              txt=(b[4] or "").lower()
              if "receptacle of the divine presence" in txt or "washing of the mouth" in txt or "feeding, clothing" in txt:
                  hits.append(b[:4])
          if hits:
              x0=min(x[0] for x in hits); y0=min(x[1] for x in hits); x1=max(x[2] for x in hits); y1=max(x[3] for x in hits)
              pad=45
              scale=2
              im=Image.open(meso_page).convert("RGB")
              box=(max(0,int((x0-pad)*scale)),max(0,int((y0-pad)*scale)),min(im.width,int((x1+pad)*scale)),min(im.height,int((y1+pad)*scale)))
              crop=im.crop(box)
              if crop.width<900:
                  crop=crop.resize((1200, round(crop.height*1200/crop.width)), Image.Resampling.LANCZOS)
              crop.save(WORK/"meso_text_crop.jpg",quality=94)
          else:
              normalize(meso_page,WORK/"meso_text_crop.jpg")

          # Normalize assets.
          normalize(met_sakhmet,WORK/"egypt_sakhmet.jpg")
          normalize(bm_mispi,WORK/"meso_tablet.jpg")
          normalize(hindu_murti,WORK/"hindu_murti.jpg")
          normalize(hindu_lamp,WORK/"hindu_lamp.jpg")
          # UCL gif upscale without inventing content.
          im=Image.open(ucl_anoint).convert("RGB")
          if im.width<1000:
              im=im.resize((1200,round(im.height*1200/im.width)),Image.Resampling.LANCZOS)
          im.save(WORK/"egypt_anoint.jpg",quality=94)

          # Opening/closing comparison board built only from the verified source images.
          tiles=[]
          for p,label in [(WORK/"egypt_anoint.jpg","古埃及"),(WORK/"meso_tablet.jpg","美索不达米亚"),(WORK/"hindu_murti.jpg","印度教")]:
              im=Image.open(p).convert("RGB")
              im=ImageOps.fit(im,(700,700),method=Image.Resampling.LANCZOS)
              tiles.append((im,label))
          canvas=Image.new("RGB",(2100,820),"white")
          draw=ImageDraw.Draw(canvas)
          for idx,(im,label) in enumerate(tiles):
              x=idx*700
              canvas.paste(im,(x,0))
              draw.rectangle((x,700,x+700,820),fill="white")
              draw.text((x+25,735),label,fill="black")
          canvas.save(WORK/"three_traditions.jpg",quality=94)

          # Verify all images decode.
          assets=[
              "three_traditions.jpg","egypt_anoint.jpg","egypt_sakhmet.jpg",
              "meso_tablet.jpg","meso_text_crop.jpg","hindu_murti.jpg","hindu_lamp.jpg"
          ]
          for n in assets:
              p=WORK/n
              with Image.open(p) as im:
                  im.verify()
              assert p.stat().st_size>5000, (n,p.stat().st_size)

          def datauri(name):
              p=WORK/name
              mime="image/png" if p.suffix.lower()==".png" else "image/jpeg"
              return f"data:{mime};base64,"+base64.b64encode(p.read_bytes()).decode()

          img={n:datauri(n) for n in assets}

          blocks = [
          {
            "text":"有些神像每天真的要洗澡、换衣服，还要给它准备饭。为什么一尊石头或者木头做的像，会被这样照料？关键要看它进了祭祀以后，到底成了一个什么样的对象。古埃及、美索不达米亚、印度教都能看到很像的动作，但三边对“神怎么和这尊像发生关系”的理解并不一样。",
            "img":"three_traditions.jpg",
            "caption":"三种传统都能看到对祭祀图像的持续照料，但各自的解释不能合并。",
            "source":"https://www.ucl.ac.uk/museums-static/digitalegypt/religion/dailycult.html"
          },
          {
            "text":"先看古埃及。现存的日常祭祀材料里，祭司会打开神龛，面对神像上香、涂油，给它换上布料和饰物，再呈上食物和饮品。柏林纸草里的阿蒙日课和阿拜多斯塞提一世神庙的浮雕都保存了这类步骤。这里的重点是，这些动作并不是偶尔给神像“保养一下”，而是每天祭祀本身的一部分。",
            "img":"egypt_anoint.jpg",
            "caption":"UCL Digital Egypt 收录的皮革木乃伊护具图像：国王向阿蒙神像涂抹香油。",
            "source":"https://www.ucl.ac.uk/museums-static/digitalegypt/religion/dailycult.html"
          },
          {
            "text":"古埃及人对神像和神的关系说得很谨慎。图像本身不等于那股神圣力量，它更像一个让神可以被看见、被接近、被侍奉的具体形式。经过开口这一类奉献仪式以后，祭司面对这尊像做的清洁、穿衣、涂油和供奉，才有了一个现实里的落点。手碰到的是神像，祭祀关系指向的是借这尊像接受服务的神。",
            "img":"egypt_sakhmet.jpg",
            "caption":"大都会艺术博物馆藏塞赫麦特神像，来自底比斯一带；这里用来直观看古埃及神像的物质形态，机制判断以日课与神庙资料为准。",
            "source":"https://www.metmuseum.org/art/collection/search/544486"
          },
          {
            "text":"美索不达米亚又是另一套说法。神像做完以后，还要经过“洗口”“开口”一类启用仪式。现存文本甚至会要求给它一张能够吃东西的嘴、一双能够听见的耳朵。仪式还会把工匠亲手制造这件东西的事实往后退，让这尊像从一件人工制品，进入神庙里能够承载神圣临在的身份。",
            "img":"meso_tablet.jpg",
            "caption":"大英博物馆藏 mīs pî（“洗口”）仪式泥板之一。",
            "source":"https://www.britishmuseum.org/collection/object/W_1881-0706-162"
          },
          {
            "text":"这样一来，后面的日常照料就接得上了。美索不达米亚的神像会被清洗、穿衣、供食、供饮，有些资料还会写到寝具和卧室。这里的神像已经进入神在神庙中的生活安排里，祭司照料它，等于在照料神在这座神庙里可以被接近的那一面。这个说法和古埃及很像，但美索不达米亚的启用仪式对“让神像成为神圣临在的承载者”说得尤其明确。",
            "img":"meso_text_crop.jpg",
            "caption":"芝加哥大学 ISAC《Ancient Mesopotamia》相关页：神像经奉献仪式成为神圣临在的承载者，并接受清洗、穿衣与供养。",
            "source":"https://isac.uchicago.edu/sites/default/files/uploads/shared/docs/ancient_mesopotamia.pdf"
          },
          {
            "text":"印度教这里还得再分细一点，因为不同宗派、神庙和家祭的做法差别很大。在很多寺庙传统里，一尊神像正式安置以后，会经过开眼、建立生命气息等奉献步骤。从这以后，神像进入持续的日常侍奉，祭司要按这套传统的规矩去照料它。这里说的也不是“石头自己变成了神”这么简单，而是神圣者通过这尊具体形象，被请到一个可以持续见面和侍奉的位置上。",
            "img":"hindu_murti.jpg",
            "caption":"Harvard Pluralism Project 的 mūrti 资料图；其页面用“建立生命气息”等仪式解释神像奉献后的持续侍奉。",
            "source":"https://pluralism.org/murti-the-image-of-god"
          },
          {
            "text":"所以在这些印度教实践里，沐浴、穿衣、供食常常带着“侍奉”和“款待”的意思。水可以用来沐浴，香、灯、花和食物按次序奉上；供过的食物又会作为圣食回到信众手里。有些传统还会按照一天的时间安排起居、进食和休息，像在服侍一位真正到场的尊贵客人。具体怎么做，要看是哪一个神庙、哪一个宗派。",
            "img":"hindu_lamp.jpg",
            "caption":"Harvard Pluralism Project 记录的印度教灯供实践；同一套 pūjā 中也包含水、香、花与食物等供奉。",
            "source":"https://pluralism.org/lamp-offerings-hindu-worship"
          },
          {
            "text":"把这三边放在一起，能比较的只有这一层：一尊图像进入正式祭祀关系以后，清洁、穿衣、供食这些动作就有了明确的对象。再往下，各自的解释马上分开。古埃及更强调神借图像变得可被侍奉；美索不达米亚会用神像启用仪式建立神圣临在；印度教不同传统里，常见的是奉献之后持续用日常侍奉维持人与神的关系。所以下次再看到有人给神像洗澡、换衣服，可以先问一句：在这套传统里，神是怎么通过这尊像被接近的？",
            "img":"three_traditions.jpg",
            "caption":"相似的是照料动作；不同的是每个传统怎样解释神圣者与图像的关系。",
            "source":"https://pluralism.org/murti-the-image-of-god"
          }
          ]

          # Basic mobile-first HTML
          parts=[]
          for i,b in enumerate(blocks,1):
              parts.append(f'''
              <section class="block">
                <div class="script">{html.escape(b["text"])}</div>
                <figure>
                  <img src="{img[b["img"]]}" alt="{html.escape(b["caption"])}">
                  <figcaption>{html.escape(b["caption"])} <a href="{b["source"]}" target="_blank" rel="noopener">来源</a></figcaption>
                </figure>
              </section>
              ''')

          sources = [
            ("古埃及｜UCL Digital Egypt：Daily Cult","https://www.ucl.ac.uk/museums-static/digitalegypt/religion/dailycult.html",
             "柏林纸草3055、阿拜多斯日课、神像着衣、涂油、供奉，以及“图像作为让神圣力量可被接近的形式”的说明。"),
            ("古埃及｜UCL Digital Egypt：Temple / cult image","https://www.ucl.ac.uk/museums-static/digitalegypt/temple/what.html",
             "神像作为接受祭祀的物质载体，而非把图像与神简单划等号。"),
            ("美索不达米亚｜Cambridge：Mīs Pî","https://www.cambridge.org/core/books/abs/transforming-literature-into-scripture/study-five-mis-pi/D9EDA6AB7D7560D5500AF9CB77E86C90",
             "“洗口”仪式把人工制作的神像引入神圣临在。"),
            ("美索不达米亚｜大英博物馆：Mīs Pî 仪式泥板","https://www.britishmuseum.org/collection/object/W_1881-0706-162",
             "仪式文本实物。"),
            ("美索不达米亚｜The Met：Mesopotamian Deities","https://www.metmuseum.org/essays/mesopotamian-deities",
             "神像被赋予神圣临在，并接受清洗、穿衣、饮食与寝具照料。"),
            ("美索不达米亚｜ISAC：Ancient Mesopotamia","https://isac.uchicago.edu/sites/default/files/uploads/shared/docs/ancient_mesopotamia.pdf",
             "神像经奉献仪式成为神圣临在的承载者，并被赋予“生命”、开眼开口。"),
            ("印度教｜Harvard Pluralism Project：Murti","https://pluralism.org/murti-the-image-of-god",
             "奉献、开眼、建立生命气息，以及神像成为持续日常侍奉对象。"),
            ("印度教｜Harvard Pluralism Project：Lamp Offerings","https://pluralism.org/lamp-offerings-hindu-worship",
             "水、香、灯、食物、沐浴、穿衣与 darshan 的实际 worship sequence。"),
            ("印度教｜Harvard Pluralism Project：Prana-pratishtha","https://pluralism.org/prana-pratishtha",
             "“建立生命气息”及奉献后每日侍奉的简要定义。")
          ]
          source_html="".join(f'<li><a href="{u}" target="_blank" rel="noopener">{html.escape(t)}</a><div>{html.escape(d)}</div></li>' for t,u,d in sources)

          html_doc=f'''<!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>隐理｜神像为什么也要洗澡、换衣、吃饭？</title>
          <style>
            :root{{--bg:#f5f2eb;--card:#fffdf8;--ink:#1e1c18;--muted:#6e675d;--line:#d9d1c4;--accent:#3f4c43}}
            *{{box-sizing:border-box}}
            body{{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}}
            main{{max-width:920px;margin:auto;padding:28px 18px 72px}}
            h1{{font-size:30px;line-height:1.28;margin:0 0 8px}}
            .meta{{color:var(--muted);font-size:14px;margin-bottom:28px}}
            .answer{{background:#ece7dc;border-left:4px solid var(--accent);padding:16px 18px;margin:0 0 24px;border-radius:8px;font-size:17px}}
            .block{{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 22px}}
            .script{{font-size:19px;line-height:1.9;letter-spacing:.01em}}
            figure{{margin:18px 0 0}}
            img{{width:100%;height:auto;display:block;border-radius:10px;background:#eee}}
            figcaption{{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55}}
            a{{color:#355f4d;text-decoration:none;border-bottom:1px solid #a8b9b0}}
            h2{{font-size:22px;margin:34px 0 14px}}
            .publish{{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:22px}}
            .publish p{{margin:8px 0}}
            .sources li{{margin:0 0 12px}}
            .sources li div{{font-size:13px;color:var(--muted)}}
            .qa{{font-size:14px;color:var(--muted);background:#eee9df;padding:15px 18px;border-radius:10px}}
            @media(max-width:620px){{main{{padding:20px 12px 50px}}h1{{font-size:25px}}.block{{padding:17px}}.script{{font-size:18px}}}}
          </style>
          </head>
          <body><main>
            <h1>神像为什么也要洗澡、换衣、吃饭？</h1>
            <div class="meta">《隐理》｜2026-10-01｜主任务 A 流量修复｜同步小红书</div>
            <div class="answer"><strong>一句核心答案：</strong>这些照料动作成立，是因为在各自祭祀体系里，神像经过特定仪式与神圣者建立了可持续的祭祀关系；但古埃及、美索不达米亚和印度教对这层关系的解释并不相同。</div>
            {''.join(parts)}

            <h2>抖音发布</h2>
            <div class="publish">
              <p><strong>最终标题：</strong>神像为什么也要洗澡、换衣、吃饭？</p>
              <p><strong>标签：</strong>#宗教史 #古埃及 #美索不达米亚 #印度教 #神像 #仪式研究</p>
            </div>

            <h2>小红书同步</h2>
            <div class="publish">
              <p><strong>标题：</strong>神像为什么要洗澡、换衣、吃饭？三个传统的答案不一样</p>
              <p><strong>封面文字：</strong>神像为什么要洗澡？</p>
              <p><strong>发布配文：</strong>同样是给神像清洁、穿衣、供食，古埃及、美索不达米亚和印度教背后的理解并不一样。这次只抓一个问题：当一尊图像进入正式祭祀关系以后，为什么这些看起来很像“照顾人”的动作会开始有宗教意义。材料主要看古埃及日课与阿拜多斯神庙资料、美索不达米亚的神像启用仪式，以及印度教寺庙里对 mūrti 的奉献与日常侍奉。相似动作可以比较，各自对神圣临在和图像的理解要分开看。</p>
              <p><strong>标签：</strong>#宗教史 #古埃及 #美索不达米亚 #印度教 #神像 #仪式文化 #神秘学研究</p>
            </div>

            <h2>资料来源与机制定位</h2>
            <ul class="sources">{source_html}</ul>

            <h2>成片自检</h2>
            <div class="qa">
              机制主角仍然是“为什么祭祀图像会进入持续照料关系”，三个传统只作为独立证据，不做习俗罗列；没有把神像与神简单画等号，没有写成三边同一原理，也没有主张直接影响。古埃及日课只取清洁、着衣、涂油、供奉和图像作用所需部分；美索不达米亚只取 mīs pî 与后续日常照料；印度教明确保留宗派与神庙差异。全稿无商业 CTA，无现代实践处方，无 AI 伪史料；正式图片均为真实馆藏、学术资料页或真实宗教实践照片，并已 Base64 内嵌。
