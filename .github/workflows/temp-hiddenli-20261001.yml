name: Build Hiddenli 2026-10-01 visuals
on:
  push:
    paths:
      - '.github/workflows/temp-hiddenli-20261001.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          mkdir -p pack
      - name: Download verified source images
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0'
          curl -A "$UA" -fL --retry 3 'https://collectionapi.metmuseum.org/api/collection/v1/iiif/587598/1179767/main-image' -o pack/01_met_ptah.jpg
          curl -A "$UA" -fL --retry 3 'https://collectionapi.metmuseum.org/api/collection/v1/iiif/551895/1219049/main-image' -o pack/02_met_abydos_offering.jpg
          curl -A "$UA" -fL --retry 3 'https://media.britishmuseum.org/media/Repository/Documents/2014_9/29_16/60210e67_fd49_42b9_ae24_a3b501146988/mid_00146071_001.jpg' -o pack/03_bm45749_mis_pi.jpg
          curl -A "$UA" -fL --retry 3 'https://collectionapi.metmuseum.org/api/collection/v1/iiif/654871/1571747/main-image' -o pack/04_met_vishnu.jpg
          curl -A "$UA" -fL --retry 3 'https://francisclooney.hsites.harvard.edu/sites/g/files/omnuum2606/files/francisclooney/files/temple.jpg' -o pack/05_pittsburgh_sv_temple.jpg
      - name: Verify images
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('pack').glob('*')):
              im=Image.open(p)
              im.verify()
              print(p.name, p.stat().st_size)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hiddenli-20261001-visuals
          path: pack/
          retention-days: 3
