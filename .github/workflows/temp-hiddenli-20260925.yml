name: Build 2026-09-25 Hiddenli source images
on:
  push:
    paths:
      - '.github/workflows/temp-hiddenli-20260925.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y python3-pil curl
      - name: Build source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack raw
          BASE='https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu'
          curl -fL "$BASE/page266-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p241.jpg
          curl -fL "$BASE/page314-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p289.jpg
          curl -fL "$BASE/page315-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p290.jpg
          curl -fL "$BASE/page316-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p291.jpg
          curl -fL "$BASE/page323-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p298.jpg
          curl -fL "$BASE/page324-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p299.jpg
          curl -fL "$BASE/page325-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p300.jpg
          curl -fL "$BASE/page326-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p301.jpg
          curl -fL "$BASE/page327-1280px-Three_Books_of_Occult_Philosophy_%28De_Occulta_Philosophia%29_%281651%29.djvu.jpg" -o raw/p302.jpg

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          # save full historical pages for direct use
          names = {
            'p241.jpg':'01_金属与行星状态_1651原页.jpg',
            'p289.jpg':'02_第34章_天体运动与行星时_1651原页.jpg',
            'p290.jpg':'03_第35章开头_行星时与人工图像_1651原页.jpg',
            'p291.jpg':'04_第35章_在特定星象下制作_1651原页.jpg',
            'p299.jpg':'05_水星日土星时与木星图像_1651原页.jpg',
            'p300.jpg':'06_火星与太阳图像_1651原页.jpg',
            'p301.jpg':'07_金星图像_1651原页.jpg',
            'p302.jpg':'08_水星与月亮图像_1651原页.jpg',
            'p298.jpg':'09_土星图像_1651原页.jpg',
          }
          for src,dst in names.items():
              im=Image.open('raw/'+src).convert('RGB')
              im.save('pack/'+dst, quality=95)

          # focused crops for mobile readability
          def crop(src, dst, box):
              im=Image.open('raw/'+src).convert('RGB')
              w,h=im.size
              x1,y1,x2,y2=box
              out=im.crop((int(w*x1),int(h*y1),int(w*x2),int(h*y2)))
              out.save('pack/'+dst, quality=96)

          crop('p241.jpg','10_银片与金星水星条件_放大.jpg',(0.04,0.23,0.96,0.96))
          crop('p289.jpg','11_第34章_运动与时日_放大.jpg',(0.05,0.39,0.96,0.97))
          crop('p291.jpg','12_第35章_特定星象下制作_放大.jpg',(0.05,0.03,0.96,0.68))
          crop('p299.jpg','13_水星日_第三土星时_星盘条件_放大.jpg',(0.04,0.02,0.96,0.43))
          crop('p299.jpg','14_木星时与木星擢升_放大.jpg',(0.05,0.40,0.96,0.96))
          crop('p300.jpg','15_火星时与太阳时_放大.jpg',(0.04,0.10,0.96,0.96))
          crop('p301.jpg','16_金星时与金星上升_放大.jpg',(0.04,0.31,0.96,0.96))
          crop('p302.jpg','17_水星时与月亮时_放大.jpg',(0.04,0.09,0.96,0.96))

          for p in Path('pack').glob('*.jpg'):
              with Image.open(p) as im:
                  im.verify()
              assert p.stat().st_size > 15000, p
              print(p.name, p.stat().st_size)
          PY
      - name: Upload source images
        uses: actions/upload-artifact@v4
        with:
          name: hiddenli-20260925-source-images
          path: pack/
          retention-days: 3
